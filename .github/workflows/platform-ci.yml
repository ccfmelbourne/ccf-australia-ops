name: Platform CI

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"

defaults:
  run:
    working-directory: platform

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
